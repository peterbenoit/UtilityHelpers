	<script>
		// ─── Minimal Test Runner ────────────────────────────────────────────────────
		const suites = [];
		let _currentSuite = null;

		function describe(name, fn) {
			_currentSuite = { name, tests: [] };
			suites.push(_currentSuite);
			fn();
			_currentSuite = null;
		}

		function it(name, fn) {
			if (_currentSuite) _currentSuite.tests.push({ name, fn });
		}

		function expect(actual) {
			const fail = (msg) => { throw new Error(msg); };
			return {
				toBe(expected) {
					if (actual !== expected) fail(`Expected ${JSON.stringify(expected)}, got ${JSON.stringify(actual)}`);
				},
				toEqual(expected) {
					const a = JSON.stringify(actual), b = JSON.stringify(expected);
					if (a !== b) fail(`Expected ${b}, got ${a}`);
				},
				toBeCloseTo(expected, precision = 5) {
					if (Math.abs(actual - expected) >= Math.pow(10, -precision) / 2)
						fail(`Expected ≈${expected}, got ${actual}`);
				},
				toBeTruthy() {
					if (!actual) fail(`Expected truthy, got ${JSON.stringify(actual)}`);
				},
				toBeFalsy() {
					if (actual) fail(`Expected falsy, got ${JSON.stringify(actual)}`);
				},
				toContain(item) {
					const ok = Array.isArray(actual) ? actual.includes(item) : String(actual).includes(String(item));
					if (!ok) fail(`Expected ${JSON.stringify(actual)} to contain ${JSON.stringify(item)}`);
				},
				not: {
					toContain(item) {
						const ok = Array.isArray(actual) ? actual.includes(item) : String(actual).includes(String(item));
						if (ok) fail(`Expected ${JSON.stringify(actual)} NOT to contain ${JSON.stringify(item)}`);
					}
				},
				toMatch(pattern) {
					if (!pattern.test(String(actual))) fail(`Expected "${actual}" to match ${pattern}`);
				},
				toHaveLength(n) {
					if (actual.length !== n) fail(`Expected length ${n}, got ${actual.length}`);
				},
				toBeGreaterThan(n) {
					if (actual <= n) fail(`Expected ${actual} > ${n}`);
				},
				toBeGreaterThanOrEqual(n) {
					if (actual < n) fail(`Expected ${actual} >= ${n}`);
				},
				toBeLessThanOrEqual(n) {
					if (actual > n) fail(`Expected ${actual} <= ${n}`);
				},
			};
		}

		async function runAll() {
			const allResults = [];
			let totalPass = 0, totalFail = 0;

			for (const suite of suites) {
				const results = [];
				for (const test of suite.tests) {
					try {
						const r = test.fn();
						if (r instanceof Promise) await r;
						results.push({ name: test.name, passed: true });
						totalPass++;
					} catch (e) {
						results.push({ name: test.name, passed: false, error: e.message });
						totalFail++;
					}
				}
				allResults.push({ suite: suite.name, results });
			}

			render(allResults, totalPass, totalFail);
		}

		function render(allResults, pass, fail) {
			const total = pass + fail;
			const allPassed = fail === 0;

			document.getElementById('summary').innerHTML = `
				<span class="font-bold text-gray-900">${total} tests</span> &mdash;
				<span class="text-green-600 font-semibold">${pass} passed</span>,
				<span class="${fail > 0 ? 'text-red-600 font-semibold' : 'text-gray-400'}">${fail} failed</span>
				<span class="ml-3 inline-flex items-center px-2 py-0.5 rounded text-xs font-medium ${allPassed ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}">
					${allPassed ? '✓ All passing' : '✗ Failures detected'}
				</span>
			`;

			document.getElementById('results').innerHTML = allResults.map(({ suite, results }) => {
				const suitePassed = results.filter(r => r.passed).length;
				const suiteTotal = results.length;
				const allPass = suitePassed === suiteTotal;
				return `
					<div class="bg-white border ${allPass ? 'border-gray-200' : 'border-red-200'} rounded-xl overflow-hidden">
						<div class="px-4 py-3 ${allPass ? 'bg-gray-50' : 'bg-red-50'} border-b ${allPass ? 'border-gray-200' : 'border-red-200'} flex items-center justify-between">
							<span class="font-semibold text-gray-800 text-sm">${suite}</span>
							<span class="text-xs font-mono ${allPass ? 'text-gray-500' : 'text-red-600'}">${suitePassed}/${suiteTotal}</span>
						</div>
						<ul class="divide-y divide-gray-100">
							${results.map(r => `
								<li class="px-4 py-2 flex items-start gap-2.5 text-sm ${r.passed ? '' : 'bg-red-50/60'}">
									<span class="${r.passed ? 'text-green-500' : 'text-red-500'} mt-0.5 shrink-0 font-bold">${r.passed ? '✓' : '✗'}</span>
									<div class="min-w-0">
										<span class="${r.passed ? 'text-gray-700' : 'text-red-700 font-medium'}">${r.name}</span>
										${r.error ? `<div class="text-xs text-red-500 mt-0.5 font-mono break-words">${r.error}</div>` : ''}
									</div>
								</li>
							`).join('')}
						</ul>
					</div>
				`;
			}).join('');
		}

			it('countOccurrences: absent value → 0', () => {

			});

			it('getRandomElement: returns element from array', () => {
				const arr = [10, 20, 30, 40, 50];
				expect(arr).toContain(UtilityHelpers.getRandomElement(arr));
			});

			it('getMedian: odd-length array', () => {

			});
			it('getMedian: even-length array', () => {
				expect(UtilityHelpers.getMedian([1, 2, 3, 4])).toBe(2.5);
			});
			it('getMedian: unsorted input', () => {
				expect(UtilityHelpers.getMedian([9, 1, 5])).toBe(5);
			});

			it('range: default step', () => {
				expect(UtilityHelpers.range(1, 5)).toEqual([1, 2, 3, 4, 5]);
			});
			it('range: custom step', () => {
				expect(UtilityHelpers.range(1, 10, 2)).toEqual([1, 3, 5, 7, 9]);
			});

			it('groupBy: string key', () => {
				const arr = [{ type: 'a' }, { type: 'b' }, { type: 'a' }];
				const result = UtilityHelpers.groupBy(arr, 'type');
				expect(result.a.length).toBe(2);
				expect(result.b.length).toBe(1);
			});
			it('groupBy: function key', () => {
				const result = UtilityHelpers.groupBy([1, 2, 3, 4], n => n % 2 === 0 ? 'even' : 'odd');
				expect(result.even).toEqual([2, 4]);
				expect(result.odd).toEqual([1, 3]);
			});
		});

				expect(UtilityHelpers.getQueryParams('')).toEqual({});

			it('shortenURL + expandURL: round-trips correctly', () => {
				const url = 'https://example.com/path?q=hello world';
				expect(UtilityHelpers.expandURL(UtilityHelpers.shortenURL(url))).toBe(url);
			});

			it('levenshteinDistance: kitten → sitting = 3', () => {
				expect(UtilityHelpers.levenshteinDistance('kitten', 'sitting')).toBe(3);
			});
			it('levenshteinDistance: identical strings = 0', () => {
				expect(UtilityHelpers.levenshteinDistance('abc', 'abc')).toBe(0);
			});
			it('levenshteinDistance: one empty string = other length', () => {
				expect(UtilityHelpers.levenshteinDistance('', 'abc')).toBe(3);
			});

			it('clamp: above max', () => {
				expect(UtilityHelpers.clamp(10, 0, 5)).toBe(5);
			});
			it('clamp: below min', () => {
				expect(UtilityHelpers.clamp(-1, 0, 5)).toBe(0);
			});
			it('clamp: within range unchanged', () => {
				expect(UtilityHelpers.clamp(3, 0, 5)).toBe(3);
			});

			it('parseJSON: valid JSON', () => {
				expect(UtilityHelpers.parseJSON('{"a":1}')).toEqual({ a: 1 });
			});
			it('parseJSON: invalid JSON returns fallback', () => {
				expect(UtilityHelpers.parseJSON('bad json', {})).toEqual({});
			});
			it('parseJSON: null fallback by default', () => {
				expect(UtilityHelpers.parseJSON('!')).toBe(null);
			});

			it('formatNumber: en-US locale', () => {
				expect(UtilityHelpers.formatNumber(1234.56, 'en-US')).toBe('1,234.56');
			});

			it('formatCurrency: USD', () => {
				expect(UtilityHelpers.formatCurrency(10.5, 'USD', 'en-US')).toBe('$10.50');
			});

			it('getFileExtension: png', () => {
				expect(UtilityHelpers.getFileExtension('image.png')).toBe('png');
			});
			it('getFileExtension: no extension → empty string', () => {
				expect(UtilityHelpers.getFileExtension('README')).toBe('');
			});
			it('getFileExtension: dotfile → empty string', () => {
				expect(UtilityHelpers.getFileExtension('.gitignore')).toBe('');
			});
		});

		describe('Performance & Optimization', () => {
			it('memoize: caches result (fn called once for same args)', () => {
				let calls = 0;
				const fn = UtilityHelpers.memoize((x) => { calls++; return x * 2; });
				fn(5); fn(5); fn(5);
				expect(calls).toBe(1);
				expect(fn(5)).toBe(10);
			});
			it('memoize: different args computed separately', () => {
				const fn = UtilityHelpers.memoize((x) => x * 2);
				expect(fn(3)).toBe(6);
				expect(fn(4)).toBe(8);
			});

			it('once: fn only runs once', () => {
				let count = 0;
				const fn = UtilityHelpers.once(() => ++count);
				fn(); fn(); fn();
				expect(count).toBe(1);
			});
			it('once: returns first result on subsequent calls', () => {
				const fn = UtilityHelpers.once(() => 42);
				fn();
				expect(fn()).toBe(42);
			});

			it('pipe: composes left-to-right', () => {
				const flow = UtilityHelpers.pipe(x => x + 1, x => x * 2);
				expect(flow(1)).toBe(4); // (1+1)*2
			});
			it('pipe: single function', () => {
				const flow = UtilityHelpers.pipe(x => x + 10);
				expect(flow(5)).toBe(15);
			});

			it('compose: composes right-to-left', () => {
				const flow = UtilityHelpers.compose(x => x + 1, x => x * 2);
				expect(flow(1)).toBe(3); // (1*2)+1
			});

			it('wait: resolves after delay', async () => {
				const start = Date.now();
				await UtilityHelpers.wait(100);
				expect(Date.now() - start).toBeGreaterThanOrEqual(90);
			});

			it('sleep: alias for wait', async () => {
				const start = Date.now();
				await UtilityHelpers.sleep(100);
				expect(Date.now() - start).toBeGreaterThanOrEqual(90);
			});

			it('debounce: defers execution until quiet period', async () => {
				let count = 0;
				const fn = UtilityHelpers.debounce(() => count++, 100);
				fn(); fn(); fn();
				expect(count).toBe(0);
				await UtilityHelpers.wait(150);
				expect(count).toBe(1);
			});
			it('debounce: resets timer on each call', async () => {
				let count = 0;
				const fn = UtilityHelpers.debounce(() => count++, 100);
				fn();
				await UtilityHelpers.wait(50);
				fn(); // reset
				await UtilityHelpers.wait(150);
				expect(count).toBe(1);
			});

			it('throttle: runs immediately on first call', () => {
				let count = 0;
				const fn = UtilityHelpers.throttle(() => count++, 500);
				fn();
				expect(count).toBe(1);
			});
			it('throttle: subsequent calls within limit are deferred', async () => {
				let count = 0;
				const fn = UtilityHelpers.throttle(() => count++, 200);
				fn(); fn(); fn();
				expect(count).toBe(1);
				await UtilityHelpers.wait(250);
				expect(count).toBe(2);
			});

			it('retry: resolves after eventual success', async () => {
				let attempts = 0;
				const fn = () => new Promise((resolve, reject) => {
					attempts++;
					if (attempts < 3) reject(new Error('not yet'));
					else resolve('ok');
				});
				const result = await UtilityHelpers.retry(fn, 3, 10);
				expect(result).toBe('ok');
				expect(attempts).toBe(3);
			});
			it('retry: throws after exhausting attempts', async () => {
				let threw = false;
				try {
					await UtilityHelpers.retry(() => Promise.reject(new Error('nope')), 2, 10);
				} catch (e) {
					threw = true;
				}
				expect(threw).toBe(true);
			});
		});

		describe('Validation & Sanitization', () => {
			it('isValidEmail: valid address', () => {
				expect(UtilityHelpers.isValidEmail('test@example.com')).toBe(true);
			});
			it('isValidEmail: missing @', () => {
				expect(UtilityHelpers.isValidEmail('notanemail')).toBe(false);
			});
			it('isValidEmail: missing domain', () => {
				expect(UtilityHelpers.isValidEmail('test@')).toBe(false);
			});
			it('isValidEmail: missing TLD', () => {
				expect(UtilityHelpers.isValidEmail('test@example')).toBe(false);
			});

			it('isValidURL: valid https URL', () => {
				expect(UtilityHelpers.isValidURL('https://example.com')).toBe(true);
			});
			it('isValidURL: valid http URL', () => {
				expect(UtilityHelpers.isValidURL('http://example.com/path?q=1')).toBe(true);
			});
			it('isValidURL: plain string', () => {
				expect(UtilityHelpers.isValidURL('not a url')).toBe(false);
			});

			it('validateText: strips disallowed chars like angle brackets', () => {
				const result = UtilityHelpers.validateText('hello <script>', {});
				expect(result.valid).toBe(true);
				expect(result.sanitized).not.toContain('<');
			});
			it('validateText: preserves common punctuation', () => {
				const result = UtilityHelpers.validateText("It's fine, right?", {});
				expect(result.valid).toBe(true);
				expect(result.sanitized).toContain("'");
			});
			it('validateText: enforces maxLength', () => {
				expect(UtilityHelpers.validateText('hello world', { maxLength: 5 }).valid).toBe(false);
			});

			it('validateEmailInput: lowercases and accepts valid email', () => {
				const result = UtilityHelpers.validateEmailInput('Test@Example.COM');
				expect(result.valid).toBe(true);
				expect(result.sanitized).toBe('test@example.com');
			});
			it('validateEmailInput: rejects invalid email', () => {
				expect(UtilityHelpers.validateEmailInput('bad').valid).toBe(false);
			});

			it('validateNumberInput: valid number string', () => {
				const result = UtilityHelpers.validateNumberInput('42', {});
				expect(result.valid).toBe(true);
				expect(result.sanitized).toBe(42);
			});
			it('validateNumberInput: enforces min', () => {
				expect(UtilityHelpers.validateNumberInput('1', { min: 5 }).valid).toBe(false);
			});
			it('validateNumberInput: enforces max', () => {
				expect(UtilityHelpers.validateNumberInput('10', { max: 5 }).valid).toBe(false);
			});
			it('validateNumberInput: non-numeric string', () => {
				expect(UtilityHelpers.validateNumberInput('abc', {}).valid).toBe(false);
			});
		});

		describe('DOM & UI Utilities', () => {
			it('getCSSVariable: reads a set variable', () => {
				document.documentElement.style.setProperty('--test-color', '#abc123');
				expect(UtilityHelpers.getCSSVariable('--test-color').trim()).toBe('#abc123');
			});

			it('setCSSVariable: sets a variable readable by getComputedStyle', () => {
				UtilityHelpers.setCSSVariable('--test-bg', 'blue');
				expect(getComputedStyle(document.documentElement).getPropertyValue('--test-bg').trim()).toBe('blue');
			});

			it('getURLParts: parses protocol, hostname, pathname', () => {
				const parts = UtilityHelpers.getURLParts('https://example.com/path?q=1');
				expect(parts.protocol).toBe('https:');
				expect(parts.hostname).toBe('example.com');
				expect(parts.pathname).toBe('/path');
			});

			it('saveScrollPosition: writes scrollY to localStorage', () => {
				UtilityHelpers.saveScrollPosition();
				expect(localStorage.getItem('scrollPos')).toBe(String(window.scrollY));
			});
			it('restoreScrollPosition: reads from localStorage', () => {
				localStorage.setItem('scrollPos', '0');
				UtilityHelpers.restoreScrollPosition();
				expect(window.scrollY).toBe(0);
			});

			it('copyToClipboard: returns a Promise', () => {
				const result = UtilityHelpers.copyToClipboard('test');
				expect(result instanceof Promise).toBe(true);
			});

			it('detectUserIdleTime: returns a cancel function', () => {
				const cancel = UtilityHelpers.detectUserIdleTime(() => { }, 60000);
				expect(typeof cancel).toBe('function');
				cancel();
			});

			it('runInParallel: resolves all tasks in order', async () => {
				const results = await UtilityHelpers.runInParallel([
					Promise.resolve(1),
					Promise.resolve(2),
					Promise.resolve(3)
				]);
				expect(results).toEqual([1, 2, 3]);
			});
			it('runInParallel: rejects if any task rejects', async () => {
				let threw = false;
				try {
					await UtilityHelpers.runInParallel([Promise.resolve(1), Promise.reject(new Error('fail'))]);
				} catch (e) {
					threw = true;
				}
				expect(threw).toBe(true);
			});
		});

		// ─── Run ────────────────────────────────────────────────────────────────────
		runAll();
	</script>
